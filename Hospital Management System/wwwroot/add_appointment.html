<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Appointment - ClinicCare Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Modern Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Modern Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand brand-title" href="dashboard.html">
        <span class="p-2 rounded-3 bg-primary text-white d-inline-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <i class="bi bi-hospital"></i>
        </span>
        ClinicCare <span class="brand-badge">Demo</span>
      </a>
      <div class="collapse navbar-collapse show">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="patients.html"><i class="bi bi-people-fill"></i> Patients</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="doctors.html"><i class="bi bi-person-badge-fill"></i> Doctors</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom active" href="appointments.html"><i class="bi bi-calendar2-check-fill"></i> Appointments</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5 flex-grow-1">
    <div class="form-card">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-1" style="color: #0f172a;">
            <i class="bi bi-calendar-plus text-primary me-2"></i>Schedule Appointment
          </h3>
          <p class="text-secondary small mb-0">Link a patient to a physician for clinical consultation</p>
        </div>
        <a href="appointments.html" class="btn btn-clinic-secondary btn-sm">
          <i class="bi bi-arrow-left"></i> Back
        </a>
      </div>

      <form id="add-appointment-form">
        <!-- Patient Selector -->
        <div class="mb-3">
          <label for="patient_id" class="form-label">Select Patient <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <select id="patient_id" class="form-select" required>
              <option value="">-- Choose Registered Patient --</option>
            </select>
          </div>
        </div>

        <!-- Doctor Selector -->
        <div class="mb-3">
          <label for="doctor_id" class="form-label">Select Attending Doctor <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
            <select id="doctor_id" class="form-select" required>
              <option value="">-- Choose Doctor / Specialist --</option>
            </select>
          </div>
        </div>

        <!-- Date and Time -->
        <div class="mb-3">
          <label for="appointment_date" class="form-label">Appointment Date & Time <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-clock"></i></span>
            <input type="datetime-local" id="appointment_date" class="form-control" required>
          </div>
        </div>

        <!-- Reason -->
        <div class="mb-4">
          <label for="reason" class="form-label">Reason for Visit / Chief Complaint</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-chat-text"></i></span>
            <input type="text" id="reason" class="form-control" placeholder="e.g. Regular Checkup, Fever, Tooth Pain">
          </div>
        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
          <a href="appointments.html" class="btn btn-clinic-secondary">Cancel</a>
          <button type="submit" id="btn-save" class="btn btn-clinic-primary">
            <i class="bi bi-calendar-check"></i> Confirm Appointment
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="clinic-footer text-center">
    <div class="container">
      <small class="text-muted">🏥 Hospital / Clinic Management System &bull; Python Flask + SQL Server Demo</small>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- API Helper -->
  <script src="js/api.js"></script>
  <script>
    async function loadDropdowns() {
      try {
        const [patients, doctors] = await Promise.all([
          apiGet('/patients'),
          apiGet('/doctors')
        ]);

        const patientSelect = document.getElementById('patient_id');
        patients.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `${p.name} (ID: #${p.id}${p.phone ? ' - ' + p.phone : ''})`;
          patientSelect.appendChild(opt);
        });

        const doctorSelect = document.getElementById('doctor_id');
        doctors.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = `${d.name} — ${d.specialization || 'General Physician'}`;
          doctorSelect.appendChild(opt);
        });

        // Set default appointment to tomorrow 10:00 AM
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(10, 0, 0, 0);
        document.getElementById('appointment_date').value = formatForDateTimeInput(tomorrow.toISOString());

      } catch (err) {
        console.error(err);
        showToast('Error loading dropdown lists: ' + err.message, 'error');
      }
    }

    const form = document.getElementById('add-appointment-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('btn-save');
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Booking...';

      const payload = {
        patientId: parseInt(document.getElementById('patient_id').value),
        doctorId: parseInt(document.getElementById('doctor_id').value),
        appointmentDate: new Date(document.getElementById('appointment_date').value).toISOString(),
        reason: document.getElementById('reason').value.trim() || null
      };

      try {
        await apiPost('/appointments', payload);
        showToast('Appointment booked successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'appointments.html';
        }, 700);
      } catch (err) {
        console.error(err);
        showToast('Failed to book appointment: ' + err.message, 'error');
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="bi bi-calendar-check"></i> Confirm Appointment';
      }
    });

    document.addEventListener('DOMContentLoaded', loadDropdowns);
  </script>
</body>
</html>
