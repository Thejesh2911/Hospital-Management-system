<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Doctor - ClinicCare Management</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Modern Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Modern Navbar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand brand-title" href="dashboard.html">
        <span class="p-2 rounded-3 bg-primary text-white d-inline-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <i class="bi bi-hospital"></i>
        </span>
        ClinicCare <span class="brand-badge">Demo</span>
      </a>
      <div class="collapse navbar-collapse show">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="patients.html"><i class="bi bi-people-fill"></i> Patients</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom active" href="doctors.html"><i class="bi bi-person-badge-fill"></i> Doctors</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="appointments.html"><i class="bi bi-calendar2-check-fill"></i> Appointments</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container my-5 flex-grow-1">
    <div class="form-card">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-1" style="color: #0f172a;">
            <i class="bi bi-pencil-square text-success me-2"></i>Edit Doctor
            <span id="doctor-id-badge" class="badge bg-light text-secondary border fs-6 align-middle ms-1">#--</span>
          </h3>
          <p class="text-secondary small mb-0">Update doctor information, specialization, and phone line</p>
        </div>
        <a href="doctors.html" class="btn btn-clinic-secondary btn-sm">
          <i class="bi bi-arrow-left"></i> Back
        </a>
      </div>

      <form id="edit-doctor-form">
        <input type="hidden" id="doctor-id">

        <!-- Doctor Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Doctor Name <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
            <input type="text" id="name" class="form-control" required>
          </div>
        </div>

        <!-- Specialization -->
        <div class="mb-3">
          <label for="specialization" class="form-label">Medical Specialization</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-heart-pulse"></i></span>
            <input 
              type="text" 
              id="specialization" 
              class="form-control" 
              list="specialization-suggestions"
            >
            <datalist id="specialization-suggestions">
              <option value="General Physician">
              <option value="Dentist">
              <option value="Pediatrician (Child Specialist)">
              <option value="ENT Specialist">
              <option value="Orthopedic (Bone Specialist)">
              <option value="Eye Specialist">
              <option value="Dermatologist (Skin)">
              <option value="Gynecologist">
            </datalist>
          </div>
        </div>

        <!-- Phone Contact -->
        <div class="mb-4">
          <label for="phone" class="form-label">Phone / OPD Direct Line</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
            <input type="tel" id="phone" class="form-control">
          </div>
        </div>

        <!-- Actions -->
        <div class="d-flex justify-content-end gap-2 pt-2 border-top">
          <a href="doctors.html" class="btn btn-clinic-secondary">Cancel</a>
          <button type="submit" id="btn-update" class="btn btn-clinic-primary">
            <i class="bi bi-check-lg"></i> Update Record
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="clinic-footer text-center">
    <div class="container">
      <small class="text-muted">🏥 Hospital / Clinic Management System &bull; Python Flask + SQL Server Demo</small>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- API Helper -->
  <script src="js/api.js"></script>
  <script>
    const doctorId = getQueryParam('id');

    async function loadDoctor() {
      if (!doctorId) {
        showToast('No doctor ID specified in URL!', 'error');
        setTimeout(() => window.location.href = 'doctors.html', 1200);
        return;
      }

      try {
        const doc = await apiGet(`/doctors/${doctorId}`);
        document.getElementById('doctor-id').value = doc.id;
        document.getElementById('doctor-id-badge').innerText = '#' + doc.id;
        document.getElementById('name').value = doc.name || '';
        document.getElementById('specialization').value = doc.specialization || '';
        document.getElementById('phone').value = doc.phone || '';
      } catch (err) {
        console.error(err);
        showToast('Could not load doctor: ' + err.message, 'error');
      }
    }

    const form = document.getElementById('edit-doctor-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-update');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Updating...';

      const payload = {
        id: parseInt(doctorId),
        name: document.getElementById('name').value.trim(),
        specialization: document.getElementById('specialization').value.trim() || null,
        phone: document.getElementById('phone').value.trim() || null
      };

      try {
        await apiPut(`/doctors/${doctorId}`, payload);
        showToast('Doctor record updated successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'doctors.html';
        }, 700);
      } catch (err) {
        console.error(err);
        showToast('Update failed: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-lg"></i> Update Record';
      }
    });

    document.addEventListener('DOMContentLoaded', loadDoctor);
  </script>
</body>
</html>
